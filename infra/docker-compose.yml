# Local servers for ingestlib's vector-store connectors, structured-retrieval
# SQL sources, and the S3-compatible artifact store — one profile per backend,
# so you start exactly the one you need:
#
#   docker compose -f infra/docker-compose.yml --profile qdrant up -d
#   docker compose -f infra/docker-compose.yml --profile qdrant down
#
# Profiles: `registry` (INTERNAL — ingestlib's own DB) · qdrant | pgvector | mongodb
# | milvus | opensearch | weaviate | mysql | minio (USER data — minio is the
# S3-compatible artifact store, the rest are vector stores + the SQL source),
# plus `all`. Ports and credentials match the formats .env.example documents.
# Data persists in named volumes; `down -v` wipes it.
#
# Not here by nature: sqlite and duckdb (no server), the `local` artifact store
# (plain files), and pinecone (cloud-only). The postgres SQL source reuses the
# pgvector container (it's plain Postgres).
#
# Image tags: everything is pinned for reproducibility — the milvus trio to the
# exact versions milvus's own compose validates (it is version-sensitive; minio
# is pulled from quay.io at that version, see below), the vector stores and SQL
# servers to a current stable release. Bump deliberately, then re-run the
# connector's e2e (make test-<backend>) against the new tag.
#
# Healthchecks: added where the image has a shell/tool to run one (the Postgres
# pair, mysql, opensearch, mongodb, and the milvus trio). qdrant and weaviate
# ship distroless images (no shell/curl), so they intentionally have none.

name: ingestlib

services:
  # ─── INTERNAL — ingestlib's own registry DB, NOT a user data store ───
  registry:
    container_name: ingestlib_registry
    image: postgres:17
    profiles: ["registry", "all", "stack"]   # stack = the full deploy (stack.yml)
    environment:
      POSTGRES_USER: ingestlib
      POSTGRES_PASSWORD: pw
      POSTGRES_DB: ingestlib
    ports:
      - "5433:5432"   # host 5433 — 5432 is the pgvector container
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingestlib -d ingestlib"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - registry-data:/var/lib/postgresql/data
      - ./registry/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # .env: INGESTLIB_REGISTRY_URL=postgresql://ingestlib:pw@localhost:5433/ingestlib

  # ─── USER data — vector-store connectors + structured-retrieval SQL sources ───
  qdrant:
    container_name: ingestlib_qdrant
    image: qdrant/qdrant:v1.18.2
    profiles: ["qdrant", "all", "stack"]
    # No healthcheck: the qdrant image is distroless (no shell/curl/wget), so
    # there is no in-container command for one to run.
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    # .env: QDRANT_URL=http://localhost:6333

  pgvector:
    container_name: ingestlib_pgvector
    image: pgvector/pgvector:pg18
    profiles: ["pgvector", "all"]
    environment:
      POSTGRES_PASSWORD: pw
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      # pg18+ images want the mount ONE level up from the classic
      # /var/lib/postgresql/data — the old path makes the entrypoint exit
      - pgvector-data:/var/lib/postgresql
    # .env: PGVECTOR_URL=postgresql://postgres:pw@localhost:5432/postgres

  mongodb:
    container_name: ingestlib_mongodb
    # Vanilla `mongo` images CANNOT serve $vectorSearch/$search — they lack
    # the mongot search process. atlas-local bundles mongod + mongot.
    image: mongodb/mongodb-atlas-local:8.0
    profiles: ["mongodb", "all"]
    # The replica-set config in the volume binds to the container's hostname —
    # without pinning it, a recreated container is "not a member" of its own
    # replica set and the image's runner panics in a crash loop
    hostname: mongodb
    ports:
      - "27017:27017"
    healthcheck:
      # start_period covers the replica-set init the atlas-local runner does first
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    volumes:
      # BOTH mounts, or restarts crash-loop: init writes the replica-set
      # keyfile to /data/configdb, and the data in /data/db demands it
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    # .env: MONGODB_URL=mongodb://localhost:27017/?directConnection=true

  # --- milvus needs its two companions (the official standalone shape;
  #     the single-container form panics without embedded-etcd config) ---
  milvus-etcd:
    container_name: ingestlib_milvus_etcd
    image: quay.io/coreos/etcd:v3.5.25
    profiles: ["milvus", "all"]
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://milvus-etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    volumes:
      - milvus-etcd-data:/etcd

  milvus-minio:
    container_name: ingestlib_milvus_minio
    # quay.io, not Docker Hub: MinIO removed the minio/minio namespace from
    # Docker Hub (community edition archived) — quay serves the same tags.
    image: quay.io/minio/minio:RELEASE.2024-05-28T17-19-04Z
    profiles: ["milvus", "all"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: minio server /minio_data
    healthcheck:
      # this minio release ships no curl — use its own client (mc) instead
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    volumes:
      - milvus-minio-data:/minio_data

  milvus:
    container_name: ingestlib_milvus
    image: milvusdb/milvus:v2.6.6
    profiles: ["milvus", "all"]
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    ports:
      - "19530:19530"  # SDK
      - "9091:9091"    # health/metrics
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    volumes:
      - milvus-data:/var/lib/milvus
    # .env: MILVUS_URL=http://localhost:19530

  opensearch:
    container_name: ingestlib_opensearch
    # Pinned to the mature 2.19.x line — DISABLE_SECURITY_PLUGIN (plain http on
    # 9200, which the connector expects) is guaranteed here; 3.x reworked security.
    image: opensearchproject/opensearch:2.19.6
    profiles: ["opensearch", "all"]
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    # .env: OPENSEARCH_URL=http://localhost:9200

  weaviate:
    container_name: ingestlib_weaviate
    image: cr.weaviate.io/semitechnologies/weaviate:1.39.2
    profiles: ["weaviate", "all"]
    # No healthcheck: the weaviate image is distroless (no shell/curl/wget), so
    # there is no in-container command for one to run.
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      # Raft state binds to the node name, which defaults to the container's
      # random hostname — without pinning it, a recreated container cannot
      # reopen the volume ("could not join raft join list") and crash-loops
      CLUSTER_HOSTNAME: node1
    ports:
      - "8080:8080"    # HTTP
      - "50051:50051"  # gRPC — the v4 client needs BOTH
    volumes:
      - weaviate-data:/var/lib/weaviate
    # .env: WEAVIATE_URL=http://localhost:8080

  # Structured-retrieval SQL source (not a vector store) — kept last, apart from
  # the vector stores above. sqlite/duckdb are serverless and the postgres SQL
  # source reuses the pgvector container, so mysql is the only SQL backend that
  # needs its own server for the gated e2e.
  mysql:
    container_name: ingestlib_mysql
    image: mysql:8
    profiles: ["mysql", "all"]
    environment:
      MYSQL_ROOT_PASSWORD: pw
      MYSQL_DATABASE: ingestlib
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-ppw"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - mysql-data:/var/lib/mysql
    # sources.yaml DSN: mysql+pymysql://root:pw@localhost:3306/ingestlib

  # ─── USER artifact store — S3-compatible object storage for document bytes; a
  #     3rd artifact_store beside `local` and cloud `s3`, distinct from the
  #     milvus-internal minio above. quay.io: MinIO left Docker Hub. ───
  minio:
    container_name: ingestlib_minio
    image: quay.io/minio/minio:RELEASE.2024-05-28T17-19-04Z
    profiles: ["minio", "all", "stack"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address :9001
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    healthcheck:
      # this minio release ships no curl — use its own client (mc) instead
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    volumes:
      - minio-data:/data
    # config.yaml: artifact_store: s3 + s3.endpoint_url: http://localhost:9000
    # .env: AWS_ACCESS_KEY_ID/SECRET_ACCESS_KEY=minioadmin (ensure_bucket auto-creates)

networks:
  default:
    name: ingestlib
    driver: bridge

volumes:
  registry-data:
  qdrant-data:
  pgvector-data:
  mongodb-data:
  mongodb-config:
  milvus-etcd-data:
  milvus-minio-data:
  milvus-data:
  opensearch-data:
  weaviate-data:
  mysql-data:
  minio-data:
